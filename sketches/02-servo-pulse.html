<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonic Rift: Servo Pulse</title>
<script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script></head>
<body style="background:#000;color:#f7931a;font-family:monospace;text-align:center;padding-top:20vh">
<h1>SONIC RIFT // Servo Pulse</h1><button id="b" style="font-size:2em;background:#f7931a;border:0;padding:.4em 1em">PLAY</button>
<p><a href="./" style="color:#f7931a">← all sketches</a></p>
<script>
const S={"title": "Servo Pulse", "bpm": 132, "bars": 40, "bass": [38, 38, 50, 38, 41, 38, 50, 36], "lead": [74, 77, 81, 77, 74, null, 72, null, 74, 77, 79, null, 77, null, null, null], "chords": [[50, 53, 57], [46, 50, 53], [48, 52, 55], [45, 48, 52]], "wave": "square"};const f=n=>Tone.Frequency(n,"midi"),btn=document.getElementById('b');let ready=false;
// Synths are built once and every note is put on the Transport timeline, so STOP silences the sketch and
// pressing PLAY again restarts it instead of layering a second copy on top.
function build(){
const echo=new Tone.FeedbackDelay("8n.",0.3).toDestination();
const kick=new Tone.MembraneSynth().toDestination();
const clap=new Tone.NoiseSynth({envelope:{decay:.15,sustain:0}}).toDestination();clap.volume.value=-12;
const hat=new Tone.MetalSynth({envelope:{decay:.05}}).toDestination();hat.volume.value=-26;
const bass=new Tone.MonoSynth({oscillator:{type:"sawtooth"},filter:{Q:2},filterEnvelope:{baseFrequency:120,octaves:2}}).toDestination();bass.volume.value=-8;
const pad=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"fatsawtooth"},envelope:{attack:.4,release:.4}}).toDestination();pad.volume.value=-20;
const typ={saw:"sawtooth",square:"square",tri:"triangle"}[S.wave];
const lead=new Tone.Synth({oscillator:{type:typ},envelope:{release:.2}}).connect(echo);lead.volume.value=-14;
const at=(pos,fn)=>Tone.Transport.schedule(fn,pos);
for(let b=0;b<S.bars;b++){const brk=b>=16&&b<20,intro=b<4,outro=b>=S.bars-4;
 for(let q=0;q<4;q++){if(!brk)at(`${b}:${q}`,t=>kick.triggerAttackRelease("C1","8n",t));
  if((q==1||q==3)&&!intro)at(`${b}:${q}`,t=>clap.triggerAttackRelease("16n",t));if(!intro||b>=2)at(`${b}:${q}:2`,t=>hat.triggerAttackRelease("C6","32n",t));}
 if((!intro||b>=2)&&!brk)S.bass.forEach((n,k)=>{if(n!=null)at(`${b}:0:${k*2}`,t=>bass.triggerAttackRelease(f(n-12),"16n",t))});
 at(`${b}m`,t=>pad.triggerAttackRelease(S.chords[b%4].map(f),"1m",t));
 if(b>=8&&!outro)for(let k=0;k<8;k++){const n=S.lead[(b%2)*8+k];if(n!=null)at(`${b}:0:${k*2}`,t=>lead.triggerAttackRelease(f(n),"8n",t))}}
// at the end, stop and reset the button (Tone.Draw keeps the DOM update in sync with the audio)
at(`${S.bars}m`,t=>Tone.Draw.schedule(stop,t));
window.__sketch={pad,lead,bass}}
function stop(){Tone.Transport.stop();Tone.Transport.position=0;btn.textContent='PLAY'}
btn.onclick=async()=>{await Tone.start();if(!ready){Tone.Transport.bpm.value=S.bpm;build();ready=true}
 if(Tone.Transport.state==='started'){stop();window.__sketch.pad.releaseAll();return}
 Tone.Transport.position=0;Tone.Transport.start();btn.textContent='STOP'};
</script><p>Code-generated sketch by Sonic Rift (Tone.js). Shaped and picked by Frog.</p></body></html>
